[tools]
"pipx:copier" = "9.19.1"
actionlint = "1.7.12"
hk = "2.7.0"
pkl = "0.32.1"
rumdl = "0.3.0"
shellcheck = "0.11.0"
tombi = "1.8.6"
yamlfmt = "0.21.0"
yamllint = "1.38.0"

[tasks.check]
description = "Run all checks"
run = "hk check --all"

[tasks.fix]
description = "Fix all issues"
run = "hk fix --all"

[tasks.test]
description = "Run tests"
run = "python3 scripts/check-template-pins.py"

[tasks."repo:new"]
description = "Scaffold a repo from the template: mise run repo:new -- ../myrepo"
run = "copier copy ."

[tasks."repo:sync"]
description = "Sync GitHub settings, labels and rulesets: mise run repo:sync -- owner/name"
run = "bash template/scripts/repo-sync.sh"
