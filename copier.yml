---
_min_copier_version: "9.0.0"
_subdirectory: template

repo_name:
  type: str
  default: "{{ _copier_conf.dst_path | basename }}"
  help: Repository name (defaults to the target folder)

github_user:
  type: str
  default: trash-panda-v91-beta
  help: GitHub owner of the repository

language:
  type: str
  choices:
    - rust
    - python
    - nix
    - none
  default: rust
  help: Toolchain flavour for .mise.toml, hk.pkl and the Dockerfile

tooling:
  type: bool
  default: true
  help: Generate .mise.toml and hk.pkl (off keeps an existing bespoke setup)

container:
  type: bool
  default: false
  help: Build and publish a container image to GHCR

knope:
  type: bool
  default: true
  help: Versioning and releases via knope (works on Forgejo and GitHub)

git_host:
  type: str
  default: "https://git.nebular-grid.space"
  help: Base URL of the forge knope opens release PRs on

git_owner:
  type: str
  default: "nebular-grid"
  help: Forge owner (org or user) that owns the new repository
