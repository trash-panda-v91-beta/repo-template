---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Approval by label, the Forgejo equivalent of the GitHub auto-approve workflow:
# a maintainer adds approve/<bot>, the bot posts the approving review.
name: Auto Approve

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    name: Approve
    if: startsWith(github.event.label.name, 'approve/')
    runs-on: ubuntu-latest
    steps:
      - name: Post approving review
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          API: ${{ github.server_url }}/api/v1
        run: |-
          set -eu
          if [ -z "${TOKEN:-}" ]; then
            echo "BOT_TOKEN is not set for this repository" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/pulls/${PR}/reviews" \
            -d '{"event":"APPROVE","body":"Auto-approved by the label bot."}')
          echo "review -> ${code}"
          cat /tmp/out
          # 422 means the bot authored this PR and cannot approve its own work
          if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
            case "${code}" in
              422) echo "the bot is the PR author, skipping" ;;
              *) exit 1 ;;
            esac
          fi
