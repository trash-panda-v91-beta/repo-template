---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: mise check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # 5.2.0

      - name: Install Nix
        if: hashFiles('flake.nix') != ''
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # 31.11.2

      # hk runs ruff, ty, actionlint, yamllint and the markdown linter, so this
      # one task is the whole static gate
      - name: Run checks
        run: mise run check

  tests:
    name: mise test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # 5.2.0

      - name: Install Python deps
        if: hashFiles('uv.lock') != ''
        run: uv sync --all-groups

      - name: Run tests
        run: mise run test
