---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: PR Conventions
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
permissions:
  contents: read
jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |-
          set -eu
          pattern='^(feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if printf '%s\n' "${TITLE}" | grep -Eq "${pattern}"; then
            echo "ok: ${TITLE}"
          else
            echo "PR title must be a Conventional Commit, for example 'fix(mcp): ...'" >&2
            echo "got: ${TITLE}" >&2
            exit 1
          fi
